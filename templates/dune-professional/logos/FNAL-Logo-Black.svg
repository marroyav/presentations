<svg xmlns="http://www.w3.org/2000/svg" width="455px" height="86px" viewBox="0 0 455 86">
<title>FNAL-Logo-Black</title>
<desc>Monochrome presentation variant. The original PNG alpha channel defines the unchanged logo shape.</desc>
<defs><mask id="logo" maskUnits="userSpaceOnUse" x="0" y="0" width="455" height="86" style="mask-type:alpha"><image href="data:image/png;base64," width="455" height="86"/></mask></defs>
<rect width="455" height="86" fill="#000000" mask="url(#logo)"/>
</svg>
